name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: bun install
      # ui/ を変えたのに src/dev/page.generated.ts を作り直し忘れていないか
      - name: Check generated pages are up to date
        run: |
          bun run build:pages
          git diff --exit-code src/dev/page.generated.ts
      - run: bun run typecheck
      - run: bun test
      - run: bun run test:node

  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno, node]
    steps:
      - uses: actions/checkout@v6

      # smoke スクリプト自体は Node で動かすので、どのランタイムでも Node は入れる
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2

      - run: node scripts/smoke.ts ${{ matrix.runtime }}
