name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - run: bun test

  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno, node]
    steps:
      - uses: actions/checkout@v6

      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
      - if: matrix.runtime == 'node'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Start server
        run: |
          case "${{ matrix.runtime }}" in
            bun)  bun run examples/bun/index.ts & ;;
            deno) deno run --allow-net examples/deno/index.ts & ;;
            node) node examples/node/index.ts & ;;
          esac

      - name: Request
        run: |
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:3000/hello