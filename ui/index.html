<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light dark" />
        <title>Senri</title>
        <!-- フォントは外から読み込まない(開くたびに外へ通信しない。オフラインでも遅れない)。theme.css のとおり、PC に入っているものを使う -->
    </head>
    <body>
        <!-- サーバーがここに簡易表示を入れる。Vue が動けば置き換わる(src/dev/fallback.ts) -->
        <div id="app"><!--senri:fallback--></div>
        <!-- サーバーがここにエラー情報の JSON を入れる(src/dev/render.ts) -->
        <script type="application/json" id="senri-data"><!--senri:data--></script>
        <script type="module" src="./src/main.ts"></script>
    </body>
</html>
