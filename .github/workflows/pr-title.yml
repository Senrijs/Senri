name: PR title

# Pull Request はスカッシュでマージするので、PR のタイトルがそのまま main のコミットになり、
# Release Please がそこからバージョンと CHANGELOG を決める。なのでタイトルが Conventional Commits の形かを確かめる
# pull_request_target はフォークからの PR でも動く。PR のコードは checkout しない(タイトルを読むだけ)
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
