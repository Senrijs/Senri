name: Publish

# - main への push: Release Please がパッケージごとにリリースの PR を作る・更新する。その PR をマージしたら、
#   タグと GitHub Release を作り、同じ実行の中で公開する
#   - @senrijs/senri(タグ vX.Y.Z): JSR と npm
#   - create-senri(タグ create-senri-vX.Y.Z、packages/create-senri): npm だけ
# - 手動実行(workflow_dispatch): 作り済みのタグを公開し直す(公開が途中で失敗したときなど。CONTRIBUTING.md)
# Release Please が作るタグは GITHUB_TOKEN で push されるので、タグの push で動くワークフローは起動しない。
# なので公開は、別のワークフローにせず、このファイルの中で続けて行う
# (npm の Trusted Publisher は、このファイル名 publish.yml で登録している。名前を変えないこと)
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "公開するタグ(例: v0.2.1、create-senri-v0.1.0)"
        required: true
        type: string

# 既定の権限は読むだけにする。書き込みが要るものは、ジョブごとに付けている
# (どのジョブも自分の permissions を持っているので、ここを書いても、それぞれのジョブの権限は変わらない)
# - release-please: contents / pull-requests / issues の write(タグ・Release・リリースの PR・ラベル)
# - publish / publish-create-senri: contents: read と id-token: write(JSR と npm の OIDC)
# - check-release: pull-requests: read
permissions:
  contents: read

# リリースの PR の更新と公開が、同時に2つ走らないようにする
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # リリースの PR に付けるラベル(autorelease: pending など)を作るため
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # ルート以外のパッケージの出力は「パス--名前」になる
      create_senri_release_created: ${{ steps.release.outputs['packages/create-senri--release_created'] }}
      create_senri_tag_name: ${{ steps.release.outputs['packages/create-senri--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # 手動実行のときは release-please が skipped になるので、!cancelled() で needs の結果を問わずに判定する
    if: >-
      !cancelled() && (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
        (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # JSR と npm に、GitHub Actions の OIDC で認証する(シークレットは使わない)
      id-token: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # タグと package.json / jsr.json のバージョンがそろっているか(v0.1.0 なら 0.1.0)
      - name: Check versions
        run: |
          tag="${TAG#v}"
          npm_version=$(node -p "require('./package.json').version")
          jsr_version=$(node -p "require('./jsr.json').version")
          if [ "$tag" != "$npm_version" ] || [ "$tag" != "$jsr_version" ]; then
            echo "タグ ($tag) と package.json ($npm_version) / jsr.json ($jsr_version) のバージョンが違います"
            exit 1
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run test:node

      # 公開し直すとき(手動実行・再実行)のために、公開済みのものは飛ばす
      # JSR: @senrijs/senri は GitHub の Senrijs/Senri とリンク済みなので、OIDC で公開できる
      - name: Publish to JSR
        run: |
          if curl -fsS https://jsr.io/@senrijs/senri/meta.json | node -e 'const m = JSON.parse(require("fs").readFileSync(0, "utf8")); process.exit(m.versions?.[process.env.VERSION] ? 0 : 1)'; then
            echo "JSR には $VERSION が公開済みなので飛ばします"
          else
            npx jsr publish
          fi

      # npm: Trusted Publishing(OIDC)で公開する。provenance(どのワークフローで作ったか)も付く
      # Trusted Publishing には npm 11.5.1 以降が必要
      - name: Publish to npm
        run: |
          if npm view "@senrijs/senri@$VERSION" version >/dev/null 2>&1; then
            echo "npm には $VERSION が公開済みなので飛ばします"
          else
            bun run build
            npm --version
            npm publish --provenance --access public
          fi

  # create-senri(npm create senri)。npm にだけ公開する(JSR には出さない)
  # 最初の 0.1.0 だけは手で公開する(npm の Trusted Publisher は、パッケージが npm にないと設定できないため。CONTRIBUTING.md)
  publish-create-senri:
    needs: release-please
    if: >-
      !cancelled() && (
        (github.event_name == 'push' && needs.release-please.outputs.create_senri_release_created == 'true') ||
        (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'create-senri-v'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.create_senri_tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # タグと packages/create-senri/package.json のバージョンがそろっているか(create-senri-v0.1.0 なら 0.1.0)
      - name: Check versions
        run: |
          tag="${TAG#create-senri-v}"
          npm_version=$(node -p "require('./packages/create-senri/package.json').version")
          if [ "$tag" != "$npm_version" ]; then
            echo "タグ ($tag) と packages/create-senri/package.json ($npm_version) のバージョンが違います"
            exit 1
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - run: node --test test/node/create-senri.test.ts

      - name: Publish to npm
        working-directory: packages/create-senri
        run: |
          if npm view "create-senri@$VERSION" version >/dev/null 2>&1; then
            echo "npm には create-senri@$VERSION が公開済みなので飛ばします"
          else
            npm --version
            npm publish --provenance --access public
          fi

  # リリースの PR をマージしたのに、タグができなかったことに気づくためのジョブ
  # Release Please は、タグを作ると PR のラベルを autorelease: pending から autorelease: tagged に付け替える。
  # この実行が終わっても pending のままのマージ済み PR があれば、タグを作れずに止まっている
  # (Release Please は警告を出すだけで成功扱いにし、以降の実行でもリリースの PR を作らなくなる)
  check-release:
    needs: release-please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check for merged release PRs without tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --base main \
            --label "autorelease: pending" --json number,title --jq '.[] | "#\(.number) \(.title)"')
          if [ -n "$prs" ]; then
            echo "::error::マージしたのにタグができていないリリースの PR があります: $prs(CONTRIBUTING.md の「マージしたのにタグができないとき」の手順で直してください)"
            exit 1
          fi
