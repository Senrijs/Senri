name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: bun install
      # ui/ を変えたのに src/dev/page.generated.ts を作り直し忘れていないか
      - name: Check generated pages are up to date
        run: |
          bun run build:pages
          git diff --exit-code src/dev/page.generated.ts
      - run: bun run typecheck
      - run: bun test
      - run: bun run test:node

  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno, node, workers, browser, create]
    steps:
      - uses: actions/checkout@v6

      # smoke スクリプト自体は Node で動かすので、どのランタイムでも Node は入れる
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # workers は bun build でまとめてから workerd(devDependencies)で動かすので、Bun と依存も入れる
      # browser も bun build でまとめてから、Playwright(devDependencies)の Chromium で開く
      # create は create-senri の4つのテンプレートを作って起動する(Bun・Deno と、wrangler のための依存が要る)
      - if: matrix.runtime == 'bun' || matrix.runtime == 'workers' || matrix.runtime == 'browser' || matrix.runtime == 'create'
        uses: oven-sh/setup-bun@v2
      - if: matrix.runtime == 'workers' || matrix.runtime == 'browser' || matrix.runtime == 'create'
        run: bun install
      - if: matrix.runtime == 'browser'
        run: npx playwright install --with-deps chromium
      - if: matrix.runtime == 'deno' || matrix.runtime == 'create'
        uses: denoland/setup-deno@v2

      - if: matrix.runtime != 'browser' && matrix.runtime != 'create'
        run: node scripts/smoke.ts ${{ matrix.runtime }}
      - if: matrix.runtime == 'create'
        run: node scripts/smoke-create.ts
      - if: matrix.runtime == 'browser'
        run: node scripts/browser.ts
