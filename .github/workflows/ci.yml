name: CI

on:
  push:
  pull_request:

# テストを回すだけなので、リポジトリを読めれば足りる
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: bun install
      # ui/ を変えたのに src/dev/page.generated.ts を作り直し忘れていないか
      - name: Check generated pages are up to date
        run: |
          bun run build:pages
          git diff --exit-code src/dev/page.generated.ts
      - run: bun run typecheck
      - run: bun test
      - run: bun run test:node

  # JSR に公開できるか(slow types のチェックなど)。公開のとき(publish.yml の npx jsr publish)と同じ確かめを、PR のうちに行う
  # 0.2.22〜0.3.0 は、公開する値に型の注釈がなく(slow types)、JSR への公開だけが落ちていた
  jsr-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
      # 型だけの import(@opentelemetry/api・ws)を、公開のときと同じく node_modules から解決する
      - run: bun install --frozen-lockfile
      - run: deno publish --dry-run

  # create-senri のテンプレートの範囲(SENRI_RANGE)が、本体の version を満たすか。公開前のテストには入れていない
  # 本体のリリースで範囲から外れると、ここだけ赤くなる(テンプレートを直して範囲を上げる合図。CONTRIBUTING.md)
  create-senri-range:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm run test:range

  # serveStatic のパスの扱いを、綴りが違っても同じファイルを開く Windows / macOS で確かめる(static のテストだけ)
  # static-paths.ts は Bun / Deno / Node を実際に起動する(Windows の Deno は、末尾の . や空白を取り除く)
  static-os:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: bun test test/static.test.ts
      - run: node scripts/static-paths.ts

  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno, node, workers, browser, create]
    steps:
      - uses: actions/checkout@v6

      # smoke スクリプト自体は Node で動かすので、どのランタイムでも Node は入れる
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # workers は bun build でまとめてから workerd(devDependencies)で動かすので、Bun と依存も入れる
      # browser も bun build でまとめてから、Playwright(devDependencies)の Chromium で開く
      # create は create-senri の4つのテンプレートを作って起動する(Bun・Deno と、wrangler のための依存が要る)
      # node は examples/node が WebSocket のために ws(devDependencies)を読むので、依存を入れる(版は bun.lock のとおり)
      - if: matrix.runtime == 'bun' || matrix.runtime == 'node' || matrix.runtime == 'workers' || matrix.runtime == 'browser' || matrix.runtime == 'create'
        uses: oven-sh/setup-bun@v2
      - if: matrix.runtime == 'node' || matrix.runtime == 'workers' || matrix.runtime == 'browser' || matrix.runtime == 'create'
        run: bun install
      - if: matrix.runtime == 'browser'
        run: npx playwright install --with-deps chromium
      - if: matrix.runtime == 'deno' || matrix.runtime == 'create'
        uses: denoland/setup-deno@v2

      - if: matrix.runtime != 'browser' && matrix.runtime != 'create'
        run: node scripts/smoke.ts ${{ matrix.runtime }}
      - if: matrix.runtime == 'create'
        run: node scripts/smoke-create.ts
      - if: matrix.runtime == 'browser'
        run: node scripts/browser.ts
